<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duc Auto ChatGPT</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div><h1>Duc Auto ChatGPT</h1><p>MVP · local XLSX image runner</p></div>
      <span id="statusChip" class="chip idle">IDLE</span>
    </header>

    <section class="card">
      <label for="workbookInput"><strong>Open XLSX</strong></label>
      <input id="workbookInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
      <p id="workbookText" class="hint">Workbook needs a <code>jobs</code> sheet with <code>id</code> and <code>prompt</code>.</p>
      <label for="referencesInput" class="secondary-label">Optional local reference images</label>
      <input id="referencesInput" type="file" accept="image/*" multiple />
      <p id="referenceText" class="hint">No local references selected.</p>
    </section>

    <section class="controls">
      <button id="validateBtn" class="secondary" disabled>Validate</button>
      <button id="runBtn" class="primary" disabled>Run</button>
      <button id="stopBtn" class="danger" disabled>Stop</button>
    </section>

    <section class="card">
      <div class="row spread"><strong>Progress</strong><span id="progressText" class="muted">0 / 0</span></div>
      <div id="progressDetail" class="hint">Open an XLSX to begin.</div>
    </section>

    <section class="card queue-card">
      <div class="row spread"><strong>Task queue</strong><span id="queueSummary" class="muted">0 jobs</span></div>
      <ol id="queueList" class="queue-list"></ol>
    </section>
    <section class="card">
      <div class="row spread"><strong>Logs</strong><button id="clearLogsBtn" class="link-button">Clear</button></div>
      <ol id="logList" class="queue-list" aria-live="polite"></ol>
    </section>

    <footer>
      Sequential only · Uses your current ChatGPT session · No server or separate login.
    </footer>
  </main>
  <script src="xlsx-codec.js"></script>
  <script src="runner-core.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
