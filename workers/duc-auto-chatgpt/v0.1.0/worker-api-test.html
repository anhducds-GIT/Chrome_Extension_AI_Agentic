<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>Duc Auto ChatGPT Worker API Test</title>
  <style>body{font:14px system-ui;margin:20px;max-width:720px}label{display:block;margin:8px 0}input,textarea{box-sizing:border-box;width:100%}button{margin:4px 4px 4px 0}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}</style>
  <h1>Worker API Test</h1>
  <p>Serve this file from <code>http://localhost</code> or <code>http://127.0.0.1</code>. It sends no request except the button-selected Worker API operation.</p>
  <label>Extension ID <input id="extensionId" autocomplete="off" placeholder="chrome://extensions ID"></label>
  <label>Job ID <input id="jobId" value="wp2-test-001"></label>
  <label>Prompt <textarea id="prompt" rows="3">Reply with exactly: WP2 bridge test passed</textarea></label>
  <button data-operation="ping">ping</button>
  <button data-operation="job.submit">submit</button>
  <button data-operation="job.status">status</button>
  <button data-operation="job.abort">abort</button>
  <pre id="output">Ready.</pre>
  <script>
    const output = document.querySelector("#output");
    document.querySelectorAll("button").forEach((button) => button.addEventListener("click", () => callWorker(button.dataset.operation)));
    function callWorker(operation) {
      const extensionId = document.querySelector("#extensionId").value.trim();
      const message = { operation, job_id: document.querySelector("#jobId").value.trim() };
      if (operation === "job.submit") Object.assign(message, { task_type: "text_prompt", prompt: document.querySelector("#prompt").value, timeout_ms: 180000 });
      if (!extensionId) return show({ ok: false, error: "Enter the unpacked extension ID." });
      if (!globalThis.chrome?.runtime?.sendMessage) return show({ ok: false, error: "Chrome external messaging API is unavailable. Use localhost, not file://." });
      chrome.runtime.sendMessage(extensionId, message, (response) => {
        const error = chrome.runtime.lastError;
        show(error ? { ok: false, error: error.message } : response);
      });
    }
    function show(value) { output.textContent = JSON.stringify(value, null, 2); }
  </script>
</html>
