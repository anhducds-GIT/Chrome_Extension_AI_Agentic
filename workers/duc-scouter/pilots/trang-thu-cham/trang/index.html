<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trang thử chậm — bàn đo của Scouter</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 40px; max-width: 40rem; }
  h1 { font-size: 1.25rem; }
  label { display: block; margin-bottom: .4rem; font-weight: 600; }
  #o-nhap { width: 100%; padding: .6rem; font: inherit; box-sizing: border-box; }
  #nut-gui { margin-top: .8rem; padding: .6rem 1.1rem; font: inherit; cursor: pointer;
             display: inline-flex; align-items: center; gap: .45rem; }
  #nut-gui .bieu-tuong { font-size: 1.1em; line-height: 1; }
  #ket-qua { margin-top: 1.4rem; padding: .8rem; border: 1px solid #999; }
  #ket-qua[hidden] { display: none; }
  #tam-chan { position: fixed; inset: 0; background: rgba(0,0,0,.45); color: #fff;
              display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  #tam-chan[hidden] { display: none; }
</style>
</head>
<body>
  <h1>Trang thử chậm</h1>
  <p>Một ô nhập, một nút, một kết quả hiện ra <strong>sau một khoảng trễ</strong>.
     Độ trễ là phần bắt buộc: nó là thứ ép người gọi phải chờ cho đúng.</p>

  <label for="o-nhap">Câu cần vọng lại</label>
  <input id="o-nhap" type="text" autocomplete="off" placeholder="gõ gì đó rồi bấm Gửi">

  <button id="nut-gui" type="button"><span class="bieu-tuong" aria-hidden="true">▶</span><span>Gửi</span></button>

  <div id="ket-qua" hidden></div>

  <div id="tam-chan" hidden>Đang bận — thử lại sau</div>

  <!-- Khoảng đệm cao để TRANG CUỘN ĐƯỢC. Không có nó thì `scout.scroll` và
       `scout.view` không có gì để đo: một trang vừa khít khung nhìn trả về
       `conLai: 0` dù cuộn chạy hay không, tức là phép đo không phân biệt
       được hai ca ngược nhau. -->
  <div id="dem-cao" style="height:2400px"></div>
  <div id="cuoi-trang">đáy trang — chỗ để `scout.scroll` cuộn tới</div>

<script>
(function () {
  "use strict";
  var TRE_MS = 1200;
  var oNhap = document.getElementById("o-nhap");
  var nut = document.getElementById("nut-gui");
  var oKetQua = document.getElementById("ket-qua");
  var tamChan = document.getElementById("tam-chan");

  // ?chan=1 dựng tấm chắn phủ kín trang. Cây DOM vẫn nguyên bên dưới, nên mọi
  // selector vẫn khớp — đó đúng là ca đã làm scout.wait nói dối ngày 12/09.
  if (new URLSearchParams(location.search).has("chan")) tamChan.hidden = false;

  // DẤU CHẨN ĐOÁN cho S-22 — trang tự kể nó đang ở trạng thái nào, vì Scouter
  // cố ý KHÔNG chạy được mã tuỳ ý trên trang. Đọc lại bằng scout.query, ví dụ
  // `body[data-hien="visible"]`. Chỉ ghi thuộc tính, không bao giờ ghi nội dung.
  var than = document.body;
  function ghiHien() {
    than.dataset.hien = document.visibilityState;
    than.dataset.focus = document.hasFocus() ? "co" : "khong";
  }
  ghiHien();
  document.addEventListener("visibilitychange", ghiHien);
  window.addEventListener("focus", ghiHien);
  window.addEventListener("blur", ghiHien);
  // Nghe ở tầng CỬA SỔ, pha bắt: sự kiện tới được trang thì ở đây thấy trước mọi
  // tay nghe khác. Không thấy ở đây nghĩa là nó không tới trang, không phải tay
  // nghe của nút hỏng.
  window.addEventListener("mousedown", function () {
    than.dataset.chuot = String(Number(than.dataset.chuot || 0) + 1);
  }, true);
  window.addEventListener("keydown", function () {
    than.dataset.phim = String(Number(than.dataset.phim || 0) + 1);
  }, true);

  // BỐN DẤU THÊM 14/09 cho nhóm "nhìn & đi lại". Cùng một khuôn với hai dấu trên,
  // và cùng một lý do: Scouter cố ý không chạy được mã trên trang, nên cách duy
  // nhất để biết một sự kiện CÓ TỚI NƠI là để chính trang đếm nó.
  //
  // `contextmenu` và `dblclick` là sự kiện TỔNG HỢP: trình duyệt chỉ sinh ra chúng
  // khi chuỗi nhấn-nhả đúng hình dạng. Nên đếm chúng trả lời được câu mà đếm
  // `mousedown` không trả lời nổi: *trình duyệt có CÔNG NHẬN đây là một lượt bấm
  // phải / bấm đúp không*, chứ không chỉ *có hai lượt nhấn tới nơi không*.
  window.addEventListener("contextmenu", function (e) {
    than.dataset.chuotphai = String(Number(than.dataset.chuotphai || 0) + 1);
    e.preventDefault();   // đừng mở menu thật: nó phủ lên trang và chặn lượt đo sau
  }, true);
  window.addEventListener("dblclick", function () {
    than.dataset.bamdup = String(Number(than.dataset.bamdup || 0) + 1);
  }, true);
  window.addEventListener("wheel", function () {
    than.dataset.banhxe = String(Number(than.dataset.banhxe || 0) + 1);
  }, true);
  // Ghi ĐỘ CUỘN, không đếm số lượt: câu cần trả lời là *trang có DI CHUYỂN không*,
  // và một lượt cuộn tới chỗ đang đứng là một lượt không di chuyển gì.
  function ghiCuon() { than.dataset.cuon = String(Math.round(window.scrollY)); }
  ghiCuon();
  window.addEventListener("scroll", ghiCuon, true);

  nut.addEventListener("click", function () {
    // Dấu NGAY LÚC BẤM, không qua bộ đếm giờ: nhờ nó mà phân biệt được
    // "lượt bấm không tới nơi" với "bộ đếm giờ không chạy".
    oKetQua.dataset.bam = String(Number(oKetQua.dataset.bam || 0) + 1);
    oKetQua.hidden = true;
    window.setTimeout(function () {
      oKetQua.textContent = "Đã vọng lại: " + oNhap.value;
      oKetQua.hidden = false;
    }, TRE_MS);
  });
})();
</script>
</body>
</html>
